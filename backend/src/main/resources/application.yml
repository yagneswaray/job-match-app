server:
  port: 8080

spring:
  application:
    name: job-match-backend
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/jobmatch.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    # Makes an unmapped URL throw NoHandlerFoundException (caught by GlobalExceptionHandler)
    # instead of DispatcherServlet calling sendError() directly, which would trigger a Tomcat
    # /error forward that re-runs the security filter chain and reports it as 403 instead of 404.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

jobmatch:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  rag-agent:
    base-url: ${RAG_AGENT_URL:http://localhost:8000}

logging:
  level:
    com.jobmatch: INFO
